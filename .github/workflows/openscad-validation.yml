name: OpenSCAD geometry validation

on:
  push:
    branches: [master]
    paths:
      - "**/*.scad"
      - "build_stl.sh"
      - "build_3mf.sh"
      - "build_bambu_project_3mf.sh"
      - "validate_geometry.py"
      - ".github/workflows/openscad-validation.yml"
  pull_request:
    paths:
      - "**/*.scad"
      - "build_stl.sh"
      - "build_3mf.sh"
      - "build_bambu_project_3mf.sh"
      - "validate_geometry.py"
      - ".github/workflows/openscad-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install OpenSCAD and Bambu Studio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openscad fonts-liberation unzip xvfb libfuse2 curl \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-0

      - name: Build generic geometry 3MF package
        run: |
          chmod +x ./build_3mf.sh
          ./build_3mf.sh

      - name: Build native Bambu Studio project 3MF package
        run: |
          chmod +x ./build_bambu_project_3mf.sh
          ./build_bambu_project_3mf.sh

      - name: Commit generated 3MF packages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "3MF packages already up to date."
          else
            git commit -m "print: generate Bambu Studio project 3MF package"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Compile printable STLs for validation only
        run: |
          chmod +x ./build_stl.sh
          ./build_stl.sh

      - name: Check calibrated parameter guard
        run: |
          openscad -o /tmp/99C_Validacao_Parametros_Calibrados.stl \
            99C_Validacao_Parametros_Calibrados.scad

      - name: Run full geometry validation
        run: python3 validate_geometry.py

      - name: Upload generic geometry 3MF package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bambulab-geometry-3mf-${{ github.sha }}
          path: "bambulab_3mf/**/*.3mf"
          if-no-files-found: error
          retention-days: 14

      - name: Upload native Bambu Studio project 3MF package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bambu-project-3mf-${{ github.sha }}
          path: "bambu_project_3mf/*.3mf"
          if-no-files-found: error
          retention-days: 14
